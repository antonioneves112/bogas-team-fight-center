<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="description"
    content="Conhece o sistema de graduações da Bogas Team Kickboxing. Descobre os requisitos para as passagens de cinto e acompanha a tua evolução!">
  <title>Bogas Team - Graduações</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./img/icones/icon-192.png" />
  <link rel="apple-touch-icon" href="./img/icones/apple-touch-icon.png" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../CSS/theme.css" />
  <link rel="stylesheet" href="../CSS/graduacoes.css" />
  <link rel="stylesheet" href="../CSS/menu.css" />
</head>

<body class="page-graduacoes">
  <!-- Menu: desenhado pelo JS/menu.js (fonte única para todas as páginas) -->
  <header class="site-header"></header>
  <div class="site-nav-overlay" aria-hidden="true"></div>
  <script src="./JS/menu.js"></script>



  <main class="main-content">
    <section class="graduacoes-shell">
      <header class="page-hero">
        <h1>Graduações</h1>
        <p>A prova de que o trabalho duro compensa. Escolhe a data e revive as conquistas que definem o nosso legado.
        </p>

        <div class="year-buttons" role="group">
          <button class="btn-tatico js-year" type="button" data-year="2026">2026</button>
          <button class="btn-tatico js-year" type="button" data-year="2025">2025</button>
          <button class="btn-tatico js-year" type="button" data-year="2024">2024</button>
        </div>
      </header>

      <section class="year-panel">
        <h2 class="year-title" id="yearTitle"></h2>
        <section class="graduacoes-container" id="yearEvents"></section>
      </section>
    </section>

    <section class="slider-section" id="gym-modal">
      <button class="close-slider btn-tatico">
        <i class='bx bx-x'></i>
      </button>

      <div class="slider-wrapper">
        <div class="slider-stage" id="modal-content-area">
          <img id="modal-main-img" class="hidden" src="" alt="">
          <video id="modal-main-video" autoplay muted playsinline controls
            class="hidden"></video>
        </div>

        <button class="slider-btn prev btn-tatico">
          <i class='bx bx-chevron-left'></i>
        </button>
        <button class="slider-btn next btn-tatico">
          <i class='bx bx-chevron-right'></i>
        </button>

        <div class="slider-caption" id="modal-caption"></div>
      </div>
    </section>
  </main>


  <script src="../JS/graduacoes.js" defer></script>


</body>

</html>
