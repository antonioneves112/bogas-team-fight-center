<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bogas Team - Convívios</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./img/icones/icon-192.png" />
  <link rel="apple-touch-icon" href="./img/icones/apple-touch-icon.png" />

  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link rel="stylesheet" href="../CSS/theme.css" />
  <link rel="stylesheet" href="../CSS/treinadores.css" />
  <link rel="stylesheet" href="../CSS/menu.css" />
</head>

<body class="page-treinadores">
  <a class="skip-link" href="#conteudo">Saltar para o conteúdo</a>

  <!-- Menu: desenhado pelo JS/menu.js (fonte única para todas as páginas) -->
  <header class="site-header"></header>
  <div class="site-nav-overlay" aria-hidden="true"></div>
  <script src="./JS/menu.js"></script>



  <main class="main-content" id="conteudo">
    <section class="trainers-shell" aria-label="Convívios">
      <header class="trainers-hero" id="muaythai">
        <h1>Convívios</h1>
        <p>
          Clica num treinador para veres os horários associados.
        </p>
      </header>

      <section class="modalidades" aria-label="Treinadores">
        <div class="imagens">
          <img src="../img/cara bogas.jpg" alt="Bogas" data-modalidade="bogas" />
          <img src="../img/cara tone.webp" alt="Tone" data-modalidade="tone" />
          <img src="../img/paulinho.webp" alt="Paulinho" data-modalidade="paulinho" />
          <img src="./img/equipa/equipa_mauro.webp" alt="Mauro" data-modalidade="mauro" />
        </div>
      </section>

      <section id="quadro-horarios" class="card card--panel2 escondido" aria-live="polite"
        aria-label="Horários do treinador">
        <div id="horarios-content"></div>
      </section>
    </section>
  </main>

  <script src="../JS/treinadores.js" defer></script>
</body>

</html>
